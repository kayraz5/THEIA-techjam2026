# ============================================================================
# #24: official NTIRE 2026 distortion pipeline as the TRAINING augmentation.
# Identical to configs/frozen_siglip2_giant_ship.yaml except degradation.backend.
# ONE variable: our 6-family table vs the official 12-family pool.
#
# NOTE: this arm was previously un-runnable, not merely un-run. third_party/
# aug_utils_train needs `kornia` (was never in requirements.txt) AND its vendored
# utils_distortions.spline() crashes on numpy>=2 ("setting an array element with a
# sequence") because np.diff returns a length-1 array that numpy 2.x will not squeeze
# into a scalar slot. Both fixed; 200 draws now exercise all 12 families with 0 failures.
#
# The official pool has NO resize and NO crop, so the eval grid still uses our table -
# otherwise train and eval augmentation would be the same distribution and the
# robustness measurement would be circular.
#
# Prediction is genuinely uncertain (see the literature comment on #24): EUSIPCO 2025
# (2506.11490) reports that >3 augmentation families is neutral-to-HARMFUL, while NTIRE
# 2026 practice runs 36 transformation types. Either outcome is worth recording.
# ============================================================================
# Arm 1: reference configuration, frozen backbone + linear head (default / fast iteration)
name: frozen_siglip2_giant_official
seed: 0
backbone:
  name: google/siglip2-giant-opt-patch16-384
  fallback: google/siglip2-so400m-patch14-384   # used only if giant exceeds 2B or does not fit in memory
  image_size: 384
  dtype: bfloat16
mode: frozen              # frozen | lora
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
data:
  sources: [sid_set, wildfake]   # scaled data pass: answers #9 (SID size curve) and #10 (generator diversity) from ONE extraction
  sid_set:
    max_train: 8000       # #9 curve: 8k == 12k, so 8k saves extraction time
    include_tampered: false   # label 2 (tampered) excluded; label 1 (full synthetic) -> fake
  wildfake:
    root: data/wildfake
    train_subsets: [real_laion5b, real_coco, mjv5, DF-GAN, styleGAN, GALIP, GigaGAN, starGAN, BigGAN]   # real_coco is filtered to /test2017/ by build_train (val2017 is held out)
    max_per_subset: 3000
  cifake:
    enabled: false        # 32x32 images; smoke-test only. See README.
    root: data/cifake
  validation:
    name: wildfake_coco_dalle3   # organisers' designated subset: 4,998 COCO val2017 real + 8,843 DALL-E Advanced fake
    exclusion_list: data/exclusion/wildfake_val_hashes.txt
  alt_real:
    name: wildfake_imagenet_heldout  # second real-only held-out set from a non-COCO source (shortcut check, spec §3)
    n: 1000
degradation:
  backend: official      # <-- THE ONLY VARIABLE vs the ship arm (table | official)
  prob: 1.0
  min_transforms: 1
  max_transforms: 3
  hflip: 0.5
  seed: 0
train:
  epochs: 30
  feature_epochs: 2      # frozen mode: number of independent degradation draws of the train set cached as features
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 0.01
  warmup_epochs: 1
  loss: ce               # ce | focal
  focal_gamma: 2.0
  focal_alpha: 0.5
  weighted_sampler: true
  amp: true
  checkpoint_metric: robust_auc
features:
  cache_dir: data/features
eval:
  batch_size: 32
  n_eval_max: 2000       # seeded subset used for the per-condition grid + degraded checkpointing (compute: ~5 img/s on M5 Pro). Clean AUC is ALSO reported on the full set.
output_dir: results/frozen_siglip2_giant_official
